; 16-channel firmware: two Low-Cost-EEG boards stacked, linked through J5.
; Flash env:board_a to the bottom board and env:board_b to the top board.
; Module: ESP32-S3-WROOM-1-N16R8, same settings as firmware/eeg.
; SYNC_CLOCK=1 only after the CLK wire and the CLKSEL change on board B (docs/05-16-channels.html).

[common]
platform = espressif32@~6.13.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D BOARD_HAS_PSRAM
  -D SYNC_CLOCK=0

[env:board_a]
extends = common
build_flags = ${common.build_flags} -D BOARD_A

[env:board_b]
extends = common
build_flags = ${common.build_flags} -D BOARD_B
