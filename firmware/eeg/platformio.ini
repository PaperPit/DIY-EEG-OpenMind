; Working EEG firmware for the Low-Cost-EEG board.
; Module in the BOM: ESP32-S3-WROOM-1-N16R8 (16 MB quad flash, 8 MB octal PSRAM).
; The generic devkit board is named "N8". The settings below override that:
; the image is 16 MB and the SDK is qio_opi.

[env:esp32-s3-devkitc-1]
platform = espressif32@~6.13.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D BOARD_HAS_PSRAM
