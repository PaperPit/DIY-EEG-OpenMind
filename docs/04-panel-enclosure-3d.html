 { k:'Обзор', t:'Стенд подключения электродов', view:'overview', state:{sockets:1,wires:1,plugs:1,shield:0,lid:0,on:1},
   html:`<p>Электроды MCScap заканчиваются штекерами TouchProof (DIN 42802, штырь 1,5 мм), а на плате стоят обычные штырьки 2,54 мм. Между ними нужен переходник.</p>
   <p>Переходник сделан как торцевая стенка прозрачного корпуса из оргстекла 3 мм: десять гнёзд EE-B05 под гайку в два ряда, за стенкой короткие провода 6–8 см до штырьков J3. На противоположной стенке тумблер питания и два USB-C: данные платы и зарядка аккумулятора через модуль TP4056.</p>
   <h2>Почему так</h2>
   <ul><li>Гнёзда держатся на гайке в стенке, а не на пайке. Электродные кабели дёргают, и угловые гнёзда на плате со временем отрываются.</li>
   <li>Провода внутри короче 8 см и закрыты корпусом. Основной сетевой шум собирают метровые кабели электродов, а не они.</li>
   <li>Плату можно снять, не трогая стенку: провода сидят на штырьках через разъёмы Dupont.</li></ul>
   <div class="tip">Крутите модель мышью, колесо приближает. Нажмите на гнездо или штырёк, чтобы увидеть, что куда идёт.</div>` },
 { k:'Плата', t:'Куда подключать: штырьки J3', view:'j3', state:{sockets:0,wires:0,plugs:0,shield:0,lid:0,box:0,pinMarks:1},
   html:`<p>Входы электродов выведены на 10 пар штырьков <span class="mono">J3A–J3J</span> у левого края платы, шаг между парами 4 мм. В каждой паре два вывода:</p>
   <ul><li><b style="color:var(--ok)">Вывод 1, внешний ряд</b> (квадратная площадка, ближе к краю): сюда идут все электроды.</li>
   <li><b>Вывод 2, внутренний ряд</b>: минусовые входы каналов, GND и SRB2. В обычном монтаже с общим референтом он остаётся свободным.</li></ul>
   <div class="tablewrap"><table class="ptab"><thead><tr><th>Штырёк</th><th>Вывод 1</th><th>Вывод 2</th></tr></thead><tbody id="j3tab"></tbody></table></div>
   <div class="callout"><b>Две ловушки.</b> У <span class="mono">J3A</span> вывод 2 это GND: электрод туда не подключать, только экран. У <span class="mono">J3J</span> вывод 2 это SRB2, он не нужен. Референт идёт на вывод 1 (REF), на плате он через R27 попадает на SRB1 и становится общим минусом для всех 8 каналов.</div>
   <p style="color:var(--muted);font-size:13px">Распиновка взята из схемы автора (лист Electrode Inputs) и сверена с вашими Gerber-файлами: квадратная площадка у всех десяти пар в ряду x = 11,0 мм.</p>` },
 { k:'Корпус', t:'Корпус из оргстекла 3 мм', view:'case', anim:'case', state:{sockets:0,wires:0,plugs:0,shield:0,lid:1,power:0},

   <h2>Как резать</h2>
   <ul><li>Проще всего отдать файл DXF в любую мастерскую лазерной резки, это 15 минут работы станка.</li>
   <li>Вручную: резак для пластика по металлической линейке, 5–8 проходов, затем отломить по краю стола. Края зашкурить бруском.</li>
   <li>Отверстия: сначала 2 мм, потом до размера на малых оборотах. Окна USB: два отверстия 8 мм рядом, остальное надфилем. Защитную плёнку не снимайте до конца работ.</li></ul>
   <h2>Порядок склейки</h2>
   <ol><li>Сначала просверлите все детали и прикрутите плату к дну на стойки 12 мм.</li>
   <li>Приклейте к дну продольные стенки E и F, потом между ними торцевые B и C. Прижмите угольником на 10 минут.</li>
   <li>Склейте бобышки попарно и вклейте в верхние углы вровень с краем стенок. Крышка крепится к ним 4 саморезами 2,9 × 9,5.</li></ol>
   <div class="callout"><b>Клей.</b> Для оргстекла на основе дихлорэтана: швы прозрачные и прочные, но клеить только при открытом окне. Цианоакрилат (суперклей) даёт белый налёт на прозрачном пластике.</div>` },
 { k:'Панель', t:'Раскладка гнёзд на стенке', view:'panel', state:{sockets:1,wires:0,plugs:0,shield:0,lid:0,labels:false},
   html:`<p>Десять гнёзд в два ряда по пять, шаг 11 мм по горизонтали и 15 мм между рядами. Это оставляет место пальцам и корпусам штекеров.</p>
   <p>Гнёзда идут в том же порядке, что штырьки J3 на плате: слева BIAS и 8-й канал, справа 1-й канал и REF (если смотреть снаружи). Поэтому номера на панели идут справа налево, зато провода внутри лежат параллельно и не перекрещиваются. REF и BIAS отличаются цветом гнёзд.</p>
   <div class="headmap" id="headmap"></div>
   <div class="tablewrap"><table class="ptab"><thead><tr><th>Гнездо</th><th>Точка 10–20</th><th>Цвет провода</th></tr></thead><tbody id="socktab"></tbody></table></div>

 { k:'Механика', t:'Сверлим стенку и ставим гнёзда', view:'inside', anim:'sockets', state:{sockets:1,wires:0,plugs:0,shield:0,lid:0},
   html:`<ol><li>Распечатайте шаблон стенки B в масштабе 100 % и проверьте линейкой контрольный отрезок 50 мм.</li>
   <li>Приклейте шаблон на плёнку стенки, наметьте центры шилом и просверлите все 10 отверстий сверлом 2 мм на малых оборотах.</li>
   <li>Штангенциркулем измерьте наружный диаметр резьбы EE-B05 и рассверлите отверстия на 0,2–0,3 мм больше (для M6 это 6,2–6,3 мм). Удобно ступенчатым сверлом.</li>

 { k:'Провода', t:'Распайка: гнездо → вывод 1 штырька', view:'wires', anim:'wires', state:{sockets:1,wires:1,plugs:0,shield:0,lid:0},
   html:`<ol><li>Возьмите готовые провода Dupont «мама–мама» 10 см, разрежьте пополам: получится 20 проводов с разъёмом на одном конце.</li>
   <li>Укоротите до 6–8 см, зачистите 3 мм, облудите и припаяйте к хвостовику гнезда. Наденьте термоусадку на место пайки.</li>
   <li>Разъём Dupont наденьте только на <b>вывод 1</b> (внешний ряд, ближе к краю платы). Внутренний ряд остаётся свободным.</li>

 { k:'Питание', t:'Аккумулятор, TP4056 и тумблер', view:'power', anim:'power', state:{sockets:1,wires:1,plugs:0,shield:0,lid:0},
   html:`<p>На плате нет зарядки, поэтому аккумулятор подключается через модуль TP4056 с защитой. Модуль стоит на полу у стенки питания, его разъём USB-C выходит в окно «ЗАРЯДКА 5 В».</p>
   <div class="tablewrap"><table class="ptab"><thead><tr><th>Откуда</th><th>Куда</th><th>Провод</th></tr></thead><tbody>
   <tr><td>Аккумулятор +</td><td>TP4056 B+</td><td>красный</td></tr>
   <tr><td>Аккумулятор −</td><td>TP4056 B−</td><td>чёрный</td></tr>
   <tr><td>TP4056 OUT+</td><td>тумблер, средний вывод</td><td>красный</td></tr>
   <tr><td>Тумблер, крайний вывод</td><td>J1 вывод 2 (+), круглая площадка</td><td>красный</td></tr>
   <tr><td>TP4056 OUT−</td><td>J1 вывод 1 (−), квадратная площадка</td><td>чёрный</td></tr></tbody></table></div>
   <ol><li>Аккумулятор подключите к B+ и B− через ответную часть JST PH, чтобы его можно было снять. Нагрузку берите только с OUT+ и OUT−: через них работает защита от переразряда и короткого замыкания.</li>
   <li>К J1 платы идёт штекер JST PH 2.0 на проводах. По схеме вывод 1 у J1 (квадратная площадка) это минус. У китайских аккумуляторов полярность разъёма бывает любой, поэтому перед первым подключением проверьте мультиметром: плюс должен прийти на круглую площадку.</li>
   <li>Переключатель SW1 на плате один раз поставьте в положение BAT и больше не трогайте. Плата включается тумблером на корпусе.</li></ol>
   <div class="callout"><b>Не перепутайте B и OUT.</b> Если аккумулятор подключить к OUT, защита не работает. Если перепутать плюс и минус аккумулятора, модуль сгорит, а аккумулятор может загореться.</div>` },
 { k:'Экран', t:'Медная фольга внутри корпуса (по желанию)', view:'shield', anim:'shield', state:{sockets:1,wires:1,plugs:0,shield:1,lid:0},
   html:`<p>Оргстекло не экранирует. Самоклеящаяся медная лента на дне, панели и задней стенке снижает наводку на провода и вход ADS1299, но закроет прозрачный корпус. Это улучшение, а не обязательный шаг: начните без него и сравните шум.</p>
   <ol><li>Фольгу с токопроводящим клеем наклейте полосами внахлёст на дно, стенку с гнёздами, заднюю стенку и крышку.</li>
   <li>На стенке с гнёздами вырежьте окна шире гаек на 2 мм, чтобы фольга не касалась гнёзд.</li>
   <li>Одну точку экрана соедините зелёным проводом с <b>выводом 2 штырька J3A</b> (GND). Только одной точкой, без петель.</li></ol>
   <div class="callout"><b>Антенна ESP32.</b> Передняя стенка и часть крышки над модулем остаются без фольги, иначе Bluetooth не пробьётся наружу. Зона показана на модели.</div>` },
 { k:'Проверка', t:'Прозвонка до первого включения', view:'test', anim:'test', state:{sockets:1,wires:1,plugs:0,shield:1,lid:0,probes:1},
   html:`<ol><li>Мультиметр в режим прозвонки. Один щуп в гнездо (подойдёт швейная игла или скрепка 1,5 мм), второй на вывод 1 нужного штырька: меньше 1 Ом.</li>
   <li>Соседние гнёзда между собой: обрыв. Каждое гнездо с фольгой: обрыв.</li>
   <li>Фольга с выводом 2 J3A: меньше 1 Ом.</li>
   <li>Включите плату с самотестом из прошлого пособия и в режиме <span class="mono">m</span> соедините скрепкой пару гнёзд, например К1 и REF. Бит lead-off канала 1 должен смениться с 1 на 0.</li></ol>
   <div class="tablewrap"><table class="ptab"><thead><tr><th>Между</th><th>Норма</th></tr></thead><tbody>
   <tr><td>Гнездо К1 → J3I вывод 1</td><td>&lt; 1 Ом</td></tr><tr><td>REF → J3J вывод 1</td><td>&lt; 1 Ом</td></tr><tr><td>BIAS → J3A вывод 1</td><td>&lt; 1 Ом</td></tr><tr><td>Любые два гнезда</td><td>обрыв</td></tr><tr><td>Гнездо → фольга</td><td>обрыв</td></tr></tbody></table></div>` },
 { k:'Зарядка', t:'Как заряжать аккумулятор', view:'charge', anim:'charge', state:{sockets:1,wires:1,plugs:0,shield:0,lid:1,charge:1,meter:1},
   html:`<ol><li>Снимите электроды с головы и выключите тумблер. Во время зарядки плата должна быть выключена: TP4056 не умеет одновременно заряжать и кормить нагрузку и может не закончить заряд.</li>
   <li>Подключите USB-C в окно «ЗАРЯДКА 5 В». Подойдёт телефонный блок питания на 5 В от 1 А или порт компьютера.</li>
   <li>Красный светодиод означает, что идёт заряд. Синий (на некоторых модулях зелёный) означает, что аккумулятор заряжен до 4,2 В. На 2000 мА·ч уходит около 2,5 часа.</li>
   <li>Отключите кабель и только потом включайте плату.</li></ol>
   <h2>Правила для LiPo</h2>
   <ul><li>Ток заряда задаёт резистор 1,2 кОм на модуле (R3, иногда R_PROG): это 1 А, подходит для 2000 мА·ч. Для аккумулятора меньше 1000 мА·ч замените его на 2,4 кОм (0,5 А).</li>
   <li>Не заряжайте без присмотра, на ткани и при температуре ниже 0 °C или выше 40 °C.</li>
   <li>Не разряжайте до отсечки защиты (около 2,5 В). Заряжайте, когда на TP6 меньше 3,5 В.</li>
   <li>Вздувшийся аккумулятор сразу замените.</li></ul>` },
 { k:'Включение', t:'Первое включение и обычный запуск', view:'on', anim:'on', state:{sockets:1,wires:1,plugs:0,shield:0,lid:0,on:1,meter:1},
   html:`<h2>Первое включение</h2>
   <ol><li>Перед этим пройдите проверку из пособия «Проверка после сборки»: нет замыканий между VIN, 3V3, AVDD, AVSS и GND.</li>
   <li>Крышка снята, электроды не подключены. Тумблер в положении ВЫКЛ, SW1 на плате в положении BAT.</li>
   <li>Включите тумблер и измерьте напряжения на контрольных точках (минус мультиметра на TP1 GND):</li></ol>
   <div class="tablewrap"><table class="ptab"><thead><tr><th>Точка</th><th>Норма</th></tr></thead><tbody>
   <tr><td>TP6 VIN</td><td>3,5–4,2 В (как у аккумулятора)</td></tr><tr><td>TP5 3V3</td><td>3,30 В</td></tr><tr><td>TP2 AVDD</td><td>+2,50 В</td></tr><tr><td>TP3 AVSS</td><td>−2,50 В</td></tr><tr><td>TP4 DVDD</td><td>3,30 В</td></tr></tbody></table></div>
   <p>Если VIN 0 В, переставьте SW1 в другое положение: значит, BAT с другой стороны. Если любое напряжение не в норме, сразу выключите тумблер.</p>
   <h2>Обычный запуск</h2>
   <ol><li>Тумблер ВКЛ. Светодиода питания на плате нет, признак работы: плата появляется в Bluetooth (или пишет в монитор порта, если подключён USB).</li>
   <li>Подключите электроды. Прошивка <span class="mono">firmware/eeg</span> стартует с током проверки контакта.</li>
   <li>Когда контакты в порядке, нажмите SW3 зубочисткой через левое отверстие в крышке: ток выключится и начнётся запись. Повторное нажатие снова включает проверку. Правое отверстие над SW2 (RESET) перезапускает плату.</li>
   <li>После записи выключите тумблер.</li></ol>
   <div class="tip">Для прошивки подключите USB-C в окно «USB данные» при включённом тумблере. Плата при этом питается от аккумулятора, USB нужен только для данных.</div>` },
 { k:'Электроды', t:'Подключаем шапку MCScap', view:'plugs', anim:'plugs', state:{sockets:1,wires:1,plugs:1,shield:0,lid:1,on:1},
   html:`<ol><li>Подпишите кабели электродов кольцами или кембриками с номером, как на панели.</li>
   <li>Вставьте штекеры TouchProof до упора. Порядок: сначала BIAS, потом REF, потом каналы.</li>
   <li>Кабели соберите в пучок и закрепите на шее или плече пациента, чтобы они не качались: движение кабеля даёт артефакты сильнее, чем любая наводка.</li></ol>

  const home=x0-T-9+5.5; G.userData.home=home; G.position.set(home,y,z); scene.add(G); plugs.push(G);
});
function setPlugs(k){ plugs.forEach((G,i)=>{ G.visible=k>0; G.position.x = G.userData.home - (1-k)*34; }); }

/* multimeter probes */
const probes = new THREE.Group(); scene.add(probes);
function probe(mat){ const g=new THREE.Group(); g.add(cyl(0.9,22,mat,0,15,0), cyl(0.25,4,M.tin,0,2,0)); return g; }
const pRed=probe(M.red), pBlack=probe(M.plasticBlk); probes.add(pRed,pBlack);
{ const s=sockets[0]; pRed.rotation.z=Math.PI/2*0.92; pRed.position.set(x0-T-9.3, s.G.position.y, s.G.position.z);
  const v=hdrPin(8,1); }
probes.visible=false;

/* ---------- state ---------- */
function setLeds(m){ M.ledR.emissive.setHex(m==='charging'?0xff2020:0); M.ledB.emissive.setHex(m==='full'?0x3a6dff:0); }
// CSS2DRenderer only checks the label's own visibility, not its parents'
function cssVis(g,v){ g.traverse(o=>{ if(o.isCSS2DObject) o.visible=v; }); }
function applyState(st){
  const vis = (o,v)=>{ o.visible=!!v; };
  sockets.forEach(s=>{ vis(s.G,st.sockets); s.outer.position.x=0; s.nut.position.x=0; s.lab.visible = !!st.sockets && (st.labels??true); });
  setWires(st.wires?1:0); setPlugs(st.plugs?1:0);
  vis(shield,st.shield); if(lidShield) lidShield.visible=!!st.shield; cssVis(shield,!!st.shield);
  vis(lid, st.lid); encl.visible = st.box!==0; panelWall.visible = window.__sticker.visible = st.box!==0;
  vis(pinMarks, st.pinMarks); cssVis(pinMarks,!!st.pinMarks);
  probes.visible=!!st.probes; document.getElementById('hudMeter').hidden=!(st.probes||st.meter); if(st.probes){ document.getElementById('mNote').textContent='мультиметр, режим прозвонки'; }
  const pw = st.box!==0 && st.power!==0; vis(power,pw); cssVis(power,pw); if(st.labels===false) cssVis(power,false);
  setLever(!!st.on); vis(charger,st.charge); charger.position.x=0; setLeds(st.charge?'full':'off');
  caseParts.forEach(c=>c.o.position.copy(c.home)); panelWall.position.x=x0; window.__sticker.position.x=x0-T-0.05;
  document.getElementById('bLid').setAttribute('aria-pressed', lid.visible);
}

/* ---------- camera ---------- */
const VIEWS = {
  overview:{p:[-175,140,190], t:[-12,0,2]},
  j3:{p:[-78,62,46], t:[-38,4,0]},
  panel:{p:[-175,8,0], t:[-74,6,0]},
  inside:{p:[-20,62,62], t:[-66,6,0]},
  wires:{p:[-5,90,95], t:[-52,8,0]},
  shield:{p:[90,120,-30], t:[-10,0,5]},
  test:{p:[-150,70,70], t:[-62,8,0]},
  plugs:{p:[-200,90,150], t:[-70,4,0]},
  case:{p:[-150,170,210], t:[-6,4,0]},
  power:{p:[150,110,120], t:[40,0,-12]},
  charge:{p:[190,70,110], t:[55,-4,-10]},
  on:{p:[170,120,140], t:[40,6,-8]},
};
let camSeq=0; const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ease = t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function moveCam(name, ms=1100){ const v=VIEWS[name]; const k=Math.min(1.9,Math.max(1,1.3/camera.aspect));
  const tgt=new THREE.Vector3(...v.t); const pos=tgt.clone().add(new THREE.Vector3(...v.p).sub(tgt).multiplyScalar(k));
  const p0=camera.position.clone(), t0=controls.target.clone(); const my=++camSeq;
  if(REDUCED){ camera.position.copy(pos); controls.target.copy(tgt); return; }
  const start=performance.now(); (function f(now){ if(my!==camSeq) return; const t=Math.min(1,(now-start)/ms), e=ease(t);
    camera.position.lerpVectors(p0,pos,e); controls.target.lerpVectors(t0,tgt,e); if(t<1) requestAnimationFrame(f); })(start); }
controls.addEventListener('start',()=>{ camSeq++; });

/* ---------- animations ---------- */
let token=0;
function tween(ms, fn, e=ease){ const my=token; if(REDUCED) ms=1;
  return new Promise(res=>{ const t0=performance.now(); (function f(now){ if(my!==token){res(false);return;}
    const t=Math.min(1,(now-t0)/ms); fn(e(t),t); if(t<1) requestAnimationFrame(f); else res(true); })(t0); }); }
const wait = ms => tween(ms,()=>{});
async function animSockets(){
  sockets.forEach(s=>{ s.outer.position.x=-40; s.nut.position.x=30; s.lab.visible=false; });
  for(let i=0;i<sockets.length;i++){ const s=sockets[i];
    if(!(await tween(360, e=>{ s.outer.position.x=-40*(1-e); }))) return; }
  await tween(900, e=>{ sockets.forEach(s=>{ s.nut.position.x=30*(1-e); s.nut.children[0].rotation.x=e*Math.PI*4; }); });
  sockets.forEach(s=>s.lab.visible=true);
}
async function animWires(){ setWires(0.001); wires.forEach(w=>{ w.hous.visible=w.band.visible=false; });
  for(let i=0;i<wires.length;i++){ const w=wires[i];
    if(!(await tween(380, e=>{ w.tube.visible=w.shrink.visible=true; w.geo.setDrawRange(0, Math.floor(w.count*e/3)*3); }))) return;
    w.hous.visible=w.band.visible=true; } }
async function animShield(){ const parts=shield.children; parts.forEach(o=>o.visible=false);
  for(const o of parts){ o.visible=true; if(!(await wait(160))) return; } }
async function animPlugs(){ setPlugs(0.001);
  const order=[9,4,0,1,2,3,5,6,7,8];
  for(const i of order){ const G=plugs[i]; G.visible=true; if(!(await tween(420, e=>{ G.position.x=G.userData.home-(1-e)*34; }))) return; } }
async function animCase(){
  const far=70; caseParts.forEach(c=>c.o.position.copy(c.home).addScaledVector(c.dir,far)); panelWall.position.x=x0-far; window.__sticker.position.x=x0-T-0.05-far;
  const seq=[...caseParts.slice(0,4), 'panel', caseParts[4]];
  for(const c of seq){ const ok=await tween(650, e=>{ if(c==='panel'){ panelWall.position.x=x0-far*(1-e); window.__sticker.position.x=x0-T-0.05-far*(1-e); } else c.o.position.copy(c.home).addScaledVector(c.dir,far*(1-e)); }); if(!ok) return; }
}
async function animPower(){ const t=power.children.filter(o=>o.geometry&&o.geometry.type==='TubeGeometry');
  t.forEach(o=>o.geometry.setDrawRange(0,0));
  for(const o of t){ const n=o.geometry.index.count; if(!(await tween(500,e=>o.geometry.setDrawRange(0,Math.floor(n*e/3)*3)))) return; }
}
async function animCharge(){ setLever(false); setLeds('off'); charger.visible=true; charger.position.x=40;
  if(!(await tween(900,e=>{ charger.position.x=40*(1-e); }))) return;
  const m=(n,v,t)=>{ document.getElementById('mName').textContent=n; document.getElementById('mVal').textContent=v; document.getElementById('mNote').textContent=t; };
  setLeds('charging'); m('Идёт заряд','3,82 В','красный светодиод, ток до 1 А'); if(!(await wait(2200))) return;
  m('Идёт заряд','4,05 В','2000 мА·ч заряжаются ≈ 2,5 часа'); if(!(await wait(2000))) return;
  setLeds('full'); m('Заряжено','4,20 В','синий светодиод, отключите кабель');
}
async function animOn(){ const m=(n,v,t)=>{ document.getElementById('mName').textContent=n; document.getElementById('mVal').textContent=v; document.getElementById('mNote').textContent=t; };
  setLever(false); m('Тумблер','ВЫКЛ','SW1 на плате в положении BAT'); if(!(await wait(1400))) return;
  if(!(await tween(400,e=>{ lever.rotation.z=-0.45+0.9*e; }))) return;
  const seq=[['TP6 · VIN','3,9 В','= напряжение аккумулятора'],['TP5 · 3V3','3,30 В','питание ESP32'],['TP2 · AVDD','+2,50 В','аналоговое +'],['TP3 · AVSS','−2,50 В','аналоговое −'],['TP4 · DVDD','3,30 В','цифровое ADS1299'],['Bluetooth','найдена','плата видна в программе']];
  for(const q of seq){ m(...q); if(!(await wait(1300))) return; }
}
async function animTest(){
  const seq=[[0,'К1 → J3I вывод 1','0,4 Ом'],[4,'REF → J3J вывод 1','0,4 Ом'],[9,'BIAS → J3A вывод 1','0,5 Ом'],[1,'К2 → К1','OL']];
  for(const [i,name,val] of seq){ const s=sockets[i]; const from=pRed.position.clone(); const to=new THREE.Vector3(x0-T-9.3,s.G.position.y,s.G.position.z);
    const hp = i===1 ? sockets[0].G.position.clone().setX(x0-T-9.3) : hdrPin(SOCK[i].hdr,1).setY(HOUS_Y0+HOUS_H+0.2);
    pBlack.rotation.set(0,0,0); if(i===1){ pBlack.rotation.z=Math.PI/2*0.92; } pBlack.position.copy(hp);
    document.getElementById('mName').textContent=name; document.getElementById('mVal').textContent='…';
    if(!(await tween(600, e=>{ pRed.position.lerpVectors(from,to,e); }))) return;
    document.getElementById('mVal').textContent=val; if(!(await wait(1400))) return; }
}

/* ---------- UI ---------- */
const pbody=document.getElementById('pbody'), stepsNav=document.getElementById('steps');
let cur=0, selected=null;
function renderNav(){ stepsNav.innerHTML = STEPS.map((s,i)=>`<button type="button" class="${i===cur?'cur':''}" data-i="${i}" title="${s.t}" aria-label="Шаг ${i+1}: ${s.t}">${i+1}</button>`).join(''); }
stepsNav.addEventListener('click', e=>{ const b=e.target.closest('button'); if(b) go(+b.dataset.i); });
const sw = i=>`<span class="sw" style="background:${WIRE_HEX[i]}"></span>`;
function headSvg(){
  const P2={Fpz:[0,-0.86],F3:[-0.36,-0.46],F4:[0.36,-0.46],C3:[-0.44,0],Cz:[0,0],C4:[0.44,0],Pz:[0,0.42],O1:[-0.26,0.8],O2:[0.26,0.8],A1:[-1.09,0]};
  const other={Fp1:[-0.26,-0.8],Fp2:[0.26,-0.8],F7:[-0.7,-0.5],F8:[0.7,-0.5],Fz:[0,-0.42],T3:[-0.86,0],T4:[0.86,0],T5:[-0.7,0.5],T6:[0.7,0.5],P3:[-0.36,0.46],P4:[0.36,0.46],A2:[1.09,0]};
  const R=92, C=[130,112]; const xy=([x,y])=>[C[0]+x*R, C[1]+y*R];
  let s=`<svg viewBox="0 0 260 226" role="img" aria-label="Схема головы 10–20 с точками подключения"><circle cx="${C[0]}" cy="${C[1]}" r="${R}" fill="none" stroke="var(--muted)" stroke-width="1.5"/>
  <path d="M${C[0]-10} ${C[1]-R+1} L${C[0]} ${C[1]-R-12} L${C[0]+10} ${C[1]-R+1}" fill="none" stroke="var(--muted)" stroke-width="1.5"/>
  <ellipse cx="${C[0]-R-4}" cy="${C[1]}" rx="6" ry="15" fill="none" stroke="var(--muted)" stroke-width="1.5"/><ellipse cx="${C[0]+R+4}" cy="${C[1]}" rx="6" ry="15" fill="none" stroke="var(--muted)" stroke-width="1.5"/>`;
  for(const [n,p] of Object.entries(other)){ const [x,y]=xy(p); s+=`<circle cx="${x}" cy="${y}" r="3" fill="var(--line)"/><text x="${x}" y="${y+12}" font-size="8" text-anchor="middle" fill="var(--muted)" font-family="JetBrains Mono, monospace">${n}</text>`; }
  SOCK.forEach(k=>{ const [x,y]=xy(P2[k.site]); const col=k.n==='REF'?'#2a5fb8':k.n==='BIAS'?'#26272b':'#c7262e';
    s+=`<circle cx="${x}" cy="${y}" r="11" fill="${col}"/><text x="${x}" y="${y+3.5}" font-size="9" font-weight="600" text-anchor="middle" fill="#fff" font-family="JetBrains Mono, monospace">${k.n.replace('К','')}</text><text x="${x}" y="${y+21}" font-size="9" text-anchor="middle" fill="var(--ink)" font-family="JetBrains Mono, monospace">${k.site}</text>`; });
  return s+'</svg>';
}
function renderPanel(){
  const s=STEPS[cur]; pbody.innerHTML=`<div class="kicker">${s.k}</div><h1>${s.t}</h1>${s.html}<div id="selBox"></div>`; pbody.scrollTop=0;
  const jt=document.getElementById('j3tab'); if(jt) jt.innerHTML=J3.map(j=>`<tr data-pick="hdr:${j.ref}"><td>${j.ref}</td><td><b>${j.p1}</b></td><td style="color:${j.p2==='GND'||j.p2==='SRB2'?'var(--warn)':'var(--muted)'}">${j.p2}</td></tr>`).join('');
  const st=document.getElementById('socktab'); if(st) st.innerHTML=SOCK.map((k,i)=>`<tr data-pick="sock:${i}"><td>${k.n}</td><td>${k.site}</td><td>${sw(k.wire)} ${WIRE_NAME[k.wire]}</td></tr>`).join('');
  const wt=document.getElementById('wiretab'); if(wt) wt.innerHTML=SOCK.map((k,i)=>`<tr data-pick="sock:${i}"><td>${sw(k.wire)} ${k.n}</td><td>${k.j3}, вывод 1</td><td class="mono">${k.sig}</td></tr>`).join('');
  const hm=document.getElementById('headmap'); if(hm) hm.innerHTML=headSvg();
  pbody.querySelectorAll('tr[data-pick]').forEach(tr=>tr.addEventListener('click',()=>select(tr.dataset.pick,true)));
  document.getElementById('badge').textContent=`Шаг ${cur+1} из ${STEPS.length}`;
  document.getElementById('bPrev').disabled = cur===0; document.getElementById('bNext').textContent = cur===STEPS.length-1?'В начало':'Дальше';
  renderNav(); renderSel();
}
function select(key, fly=false){ selected=key; renderSel();
  sockets.forEach(s=>s.el.classList.remove('hot'));
  if(key && key.startsWith('sock:')){ const s=sockets[+key.slice(5)]; s.el.classList.add('hot');
    if(fly){ camSeq++; const p=s.G.position; controls.target.set(-60,p.y,p.z*0.6); } }
  if(key && key.startsWith('hdr:') && fly){ camSeq++; const j=J3.find(q=>q.ref===key.slice(4)); controls.target.set(12.27-50,4,-(j.y-25)); }
}
function renderSel(){ const b=document.getElementById('selBox'); if(!b) return; if(!selected){ b.innerHTML=''; return; }
  let h='';
  if(selected.startsWith('sock:')){ const k=SOCK[+selected.slice(5)];
    h=`<div class="ref">Гнездо ${k.n} · ${k.site}</div><div>${sw(k.wire)} провод ${WIRE_NAME[k.wire]} → <b>${k.j3}, вывод 1</b> (${k.sig})</div>`; }
  else { const j=J3.find(q=>q.ref===selected.slice(4)); const k=SOCK.find(q=>q.j3===j.ref);
    h=`<div class="ref">${j.ref}</div><div>Вывод 1: <b>${j.p1}</b> ← гнездо ${k.n}</div><div style="color:var(--muted)">Вывод 2: ${j.p2}${j.p2==='GND'?', только для экрана':j.p2==='SRB2'?', не подключать':', свободен'}</div>`; }
  b.innerHTML=`<div class="sel">${h}</div>`; }
async function go(i){
  if(i<0||i>=STEPS.length) return; token++; cur=i; selected=null;
  const s=STEPS[i]; applyState(s.state); renderPanel(); moveCam(s.view);
  try{ switch(s.anim){ case 'sockets': await animSockets(); break; case 'wires': await animWires(); break; case 'shield': await animShield(); break;
    case 'plugs': await animPlugs(); break; case 'test': await animTest(); break; case 'case': await animCase(); break;
    case 'power': await animPower(); break; case 'charge': await animCharge(); break; case 'on': await animOn(); break; } }catch(e){ console.error(e); }
}
document.getElementById('bNext').onclick=()=>go(cur===STEPS.length-1?0:cur+1);
document.getElementById('bPrev').onclick=()=>go(cur-1);
document.getElementById('bReplay').onclick=()=>go(cur);
document.getElementById('bLid').onclick=e=>{ lid.visible=!lid.visible; e.currentTarget.setAttribute('aria-pressed',lid.visible); };
document.getElementById('bCase').onclick=e=>{ const v=!encl.visible; encl.visible=v; e.currentTarget.setAttribute('aria-pressed',!v); };
document.getElementById('bView').onclick=()=>moveCam('overview');
addEventListener('keydown',e=>{ if(e.target.closest('input')) return; if(e.key==='ArrowRight') go(Math.min(cur+1,STEPS.length-1)); if(e.key==='ArrowLeft') go(cur-1); });

const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(); let downAt=null;
renderer.domElement.addEventListener('pointerdown',e=>{ downAt=[e.clientX,e.clientY]; document.getElementById('hint').hidden=true; });
renderer.domElement.addEventListener('pointerup',e=>{ if(!downAt) return; const moved=Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1]); downAt=null; if(moved>5) return;
  const r=renderer.domElement.getBoundingClientRect(); ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera); const hit=ray.intersectObjects(pickables.filter(o=>{ let v=true; o.traverseAncestors(a=>{ if(!a.visible) v=false; }); return v&&o.visible; }),false)[0];
  if(hit) select(hit.object.userData.pick); });

function resize(){ const w=vp.clientWidth, h=vp.clientHeight; renderer.setSize(w,h,false); renderer.domElement.style.width=w+'px'; renderer.domElement.style.height=h+'px'; labelR.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(vp); resize();
GuideKit.loop(renderer, ()=>{ controls.update(); renderer.render(scene,camera); labelR.render(scene,camera); }, {controls, resize, idleFps:0});

const hashStep = parseInt((location.hash||'').replace(/\D/g,''),10);
go(Number.isFinite(hashStep) && hashStep>=1 && hashStep<=STEPS.length ? hashStep-1 : 0);
window.__panel={go,camera,controls,scene};
</script>
</body></html>
