   <li>Свободен только J5 (GND-RX-TX). Поэтому у второй платы свой ESP32, а A и B говорят по UART.</li></ul>
   <div class="callout"><b>Сначала 8 каналов.</b> Плата A должна пройти все проверки частей 1–3 и показать альфа-ритм. Только потом добавляйте этаж: так любую ошибку легко найти.</div>
   <div class="tip">Нужна вторая плата из заказа Резонита и второй комплект деталей. Новую печатную плату заказывать не надо. Текстовая версия: <a href="05-16-channels.html">05 Второй этаж</a>.</div>` },
 { k:'Плата B', t:'Что паять на плате B иначе', view:'boardB', state:{a:0,b:1,box:0,sock2:0,wiresB:0,j5:0,pwrB:0,marksB:1},
   html:`<p>Плата B собирается по <a href="01-assembly-3d.html">части 1</a>, как A. Отличий четыре, они подписаны на модели:</p>
   <ol><li><b>SW1 не ставить.</b> Вместо него перемычка проводом между средним отверстием (VIN) и тем крайним, которое звонится на «+» разъёма J1 (VBAT). Тогда B включается тем же тумблером, что A, а этаж ниже на 7 мм.</li>
   <li><b>JP1 (BOUT-BIN) не замыкать.</b> BIAS на голову подаёт только A.</li>
   <li><b>Штырьки J3 не ставить.</b> Провода от гнёзд К9–К16 паяются прямо в отверстия «1+» … «8+» и «REF».</li>
   <li><b>J5 и USB-C поставить.</b> J5 нужен для связи с A, через USB-C прошивается B.</li></ol>
   <div class="tip">Подпишите плату маркером: <b class="tagB">B</b>. Нижняя сторона (C15–C31, R32–R35) паяется как обычно.</div>` },
 { k:'Самотест', t:'Проверьте плату B отдельно', view:'bTest', anim:'selftest', state:{a:0,b:1,box:0,term:1},
   html:`<p>До сборки этажа плата B проходит ту же проверку, что A: <a href="02-tests-3d.html">часть 2</a>, шаги 1–11, с прошивкой самотеста.</p>
   <ol><li>Питание на J1 от аккумулятора: перемычка вместо SW1 уже стоит, от USB плата B не включается.</li>
   <li>USB-C к компьютеру нужен только для монитора порта и прошивки.</li>
   <li>Шесть напряжений на TP1–TP6, затем самотест.</li></ol>
   <div class="tablewrap"><table class="ptab"><thead><tr><th>Проверка</th><th>Норма</th></tr></thead><tbody>
   <tr><td>ID</td><td>0x3E, иначе чип поддельный или не пропаян</td></tr>
   <tr><td>DRDY</td><td>250 Гц</td></tr>
   <tr><td>Тестовый сигнал</td><td>на всех 8 каналах</td></tr>
   <tr><td>Шум, входы замкнуты</td><td>как у платы A</td></tr></tbody></table></div>` },
 { k:'Прошивка', t:'Прошейте обе платы', view:'bUsb', anim:'flash', state:{a:0,b:1,box:0,term:1},
   html:`<p>Откройте папку <span class="mono">firmware/eeg16</span> в VS Code с PlatformIO. В ней два окружения:</p>
   <div class="tablewrap"><table class="ptab"><thead><tr><th>Окружение</th><th>Плата</th><th>Что делает</th></tr></thead><tbody>
   <tr><td>board_a</td><td><b class="tagA">A</b>, нижняя</td><td>каналы 1–8 свои, 9–16 от B; Bluetooth <span class="mono">ESP32_EEG_DATA</span></td></tr>
   <tr><td>board_b</td><td><b class="tagB">B</b>, верхняя</td><td>каналы 9–16, каждый отсчёт на A по J5; Bluetooth выключен</td></tr></tbody></table></div>
   <ol><li>Внизу слева в строке PlatformIO выберите окружение (env), подключите нужную плату по USB-C и нажмите Upload.</li>
   <li>Шейте до сборки этажа: потом USB-C платы B закрыт стенкой корпуса, если не прорезать для него второе окно.</li></ol>
   <div class="tip"><span class="mono">board_a</span> заменяет прошивку <span class="mono">firmware/eeg</span>. Страница <a href="viewer.html">просмотра сигнала</a> сама показывает 8 или 16 каналов.</div>` },
 { k:'Плата A', t:'Плата A: провода прямо на штырьки', view:'j3', state:{a:1,b:0,box:1,lid:0,wiresA:1,up:0},
   html:`<p>Колодки Dupont на штырьках J3 занимают по высоте 15 мм, а между платами будет 12. Поэтому на A провода припаиваются прямо к штырькам:</p>
   <ol><li>Снимите колодку Dupont с вывода 1 и откусите её вместе с 5 мм провода.</li>
   <li>Зачистите 3 мм, облудите, наденьте термоусадку 1,5–2 мм и припаяйте провод сбоку к штырьку у самого его верха.</li>
   <li>Усадите термоусадку. Высота штырька 8,5 мм над платой, до платы B остаётся 3,5 мм.</li></ol>
   <div class="callout"><b>Если штырьки ещё не стоят</b>, не ставьте их: провода паяются прямо в отверстия J3, как на плате B.</div>` },
 { k:'Этаж', t:'Стойки и плата B', view:'stack', anim:'stack', state:{a:1,b:1,box:1,lid:0,wiresA:1,up:1},
   html:`<ol><li>Измерьте самую высокую деталь на A (обычно J1, C34 или штырьки). Она должна быть ниже 12 мм хотя бы на 1,5 мм. Если выше, возьмите стойки 15 мм и проверьте зазор до крышки.</li>
   <li>Выкрутите 4 верхних винта платы A и вкрутите вместо них латунные стойки M3 «папа–мама» 12 мм. Резьба стойки проходит через плату A и держит её вместо винта.</li>
   <li>Положите B сверху той же стороной и в ту же сторону: антенны ESP32 друг над другом, J3 к стенке с гнёздами.</li>
   <li>Закрепите B четырьмя винтами M3×6.</li></ol>
   <div class="tablewrap"><table class="ptab"><thead><tr><th>Что</th><th>Сколько</th></tr></thead><tbody>
   <tr><td>Стойки M3 «папа–мама» 12 мм</td><td>4</td></tr><tr><td>Винты M3×6</td><td>4</td></tr></tbody></table></div>` },
 { k:'J5', t:'Связь: J5 крест-накрест', view:'j5', anim:'j5', state:{a:1,b:1,box:0,wiresA:0,j5:1,up:1,tags:'j5'},
   html:`<p>Три провода по 6–8 см, скрутите их между собой. Надпись на плате у разъёма: <b>GND-RX-TX</b>.</p>
   <div class="tablewrap"><table class="ptab"><thead><tr><th>Плата A</th><th></th><th>Плата B</th><th>Что идёт</th></tr></thead><tbody>
   <tr><td>TX (GPIO43)</td><td>→</td><td>RX (GPIO44)</td><td>команды от A: проверка контакта, тест, старт</td></tr>
   <tr><td>RX (GPIO44)</td><td>←</td><td>TX (GPIO43)</td><td>отсчёты каналов 9–16, 921600 бод</td></tr>
   <tr><td>GND</td><td>—</td><td>GND</td><td>общая земля</td></tr></tbody></table></div>
   <ul><li>На A провода паяются к верхушкам штырьков J5, на B к выводам J5, торчащим снизу платы.</li>
   <li>TX одной платы всегда идёт на RX другой. TX на TX ничего не сожжёт, но данных не будет.</li></ul>` },
 { k:'Питание', t:'Питание второй платы', view:'power', anim:'power', state:{a:1,b:1,box:1,lid:0,wiresA:0,j5:1,pwrB:1,up:1,tags:'pwr'},
   html:`<p>Обе платы питаются от одного аккумулятора через тот же тумблер.</p>
   <ol><li>Возьмите второй штекер JST PH 2.0 на проводах.</li>
   <li>Красный припаяйте к крайнему выводу тумблера, туда же, где красный провод к J1 платы A. Чёрный к OUT− модуля TP4056.</li>
   <li>Вставьте штекер в J1 платы B. Перед этим прозвоните: плюс на круглой площадке, минус на квадратной.</li></ol>
   <div class="tablewrap"><table class="ptab"><thead><tr><th>Откуда</th><th>Куда</th></tr></thead><tbody>
   <tr><td>Тумблер, крайний вывод</td><td>J1 платы B, вывод 2 (+)</td></tr><tr><td>TP4056 OUT−</td><td>J1 платы B, вывод 1 (−)</td></tr></tbody></table></div>
   <div class="tip">Две платы берут примерно в полтора раза больше тока, аккумулятор сядет быстрее. Когда к A подключён USB для монитора, B всё равно питается от аккумулятора, это нормально.</div>` },
 { k:'Гнёзда', t:'REF и каналы 9–16', view:'sock2', anim:'sock2', state:{a:1,b:1,box:1,lid:0,wiresA:1,sock2:1,wiresB:1,ref:1,j5:1,pwrB:1,up:1,tags:'ref'},
   html:`<p>В торцевой стенке места нет. Восемь новых гнёзд EE-B05 ставятся в заднюю длинную стенку F (без антенны) двумя рядами по четыре, с тем же шагом: 11 мм по горизонтали, 15 мм между рядами.</p>
   <div class="tablewrap"><table class="ptab"><thead><tr><th>Гнездо</th><th>Точка</th><th>Куда на B</th></tr></thead><tbody id="sock2tab"></tbody></table></div>
   <ul><li><b>REF</b> один электрод на обе платы: от вывода 1 штырька J3J платы A короткий провод к отверстию «REF» платы B (показан белым).</li>
   <li><b>BIAS</b> только с A, как раньше. «BIAS» на B пустой.</li>
   <li>Цвета К9–К16 повторяют К1–К8. На каждый провод B наденьте кусочек скотча с буквой B.</li></ul>
   <div class="tip">Раскладка 10-20 для 16 каналов: на A ваши восемь точек, на B лобные, височные и теменно-височные. Вместе это вся голова.</div>` },
 { k:'Корпус', t:'Всё в корпусе', view:'case', state:{a:1,b:1,box:1,lid:1,wiresA:1,sock2:1,wiresB:1,ref:1,j5:1,pwrB:1,up:1,dims:1},
   html:`<p>Высота пакета: 12 мм (A над дном) + 1,6 + 12 + 1,6 + детали B около 7 мм ≈ 34 мм. Внутри корпуса 38 мм, крышка закрывается.</p>
   <ul><li>По желанию прорежьте в стенке питания второе окно USB-C на 13,6 мм выше первого. Тогда B можно перепрошивать без разборки.</li>
   <li>Отверстия в крышке над SW3 и SW2 теперь закрыты платой B. Кнопка SW3 на A не нужна: проверку контакта выключает команда, а SW3 на B ничего не делает. Для перезапуска выключите тумблер.</li>
   <li>Провода J5 и REF уложите вдоль края, подальше от антенн ESP32.</li></ul>` },
 { k:'Проверка', t:'Проверка: 16 каналов', view:'check', anim:'check', state:{a:1,b:1,box:1,lid:1,wiresA:1,sock2:1,wiresB:1,ref:1,j5:1,pwrB:1,up:1,term:1},
   html:`<p>Электродов на голове нет. Тумблер включён, к A подключён USB, в PlatformIO открыт монитор порта A (115200).</p>
   <ol><li>В мониторе есть <span class="mono">Board A, 16 channels</span> и <span class="mono">Board B: data is coming</span>. Если <span class="mono">NO DATA</span>, проверьте J5 крест-накрест и питание B.</li>
   <li>Раз в 10 секунд строка <span class="mono">B samples used … repeated …</span>: первое число растёт примерно на 2500, второе маленькое, <span class="mono">bad frames</span> около нуля.</li>
   <li>Введите <span class="mono">t</span> и Enter: обе платы включают тестовый сигнал. В <a href="viewer.html">просмотре</a> «идёт поток, каналов 16», на всех 16 графиках одинаковые зубцы 2 раза в секунду. Канал без зубцов значит ошибку пайки на этом входе.</li>
   <li>Снова <span class="mono">t</span>: тест выключен. Без электродов все каналы и REF показывают «обрыв».</li>
   <li>На голове: REF на мочке, BIAS на лбу, К1/К2 на O1/O2, К15/К16 на P7/P8. С закрытыми глазами альфа видна на К1, К2 и слабее на К15, К16.</li></ol>` },
 { k:'По желанию', t:'Общий такт для двух ADS1299', view:'clock', anim:'clock', state:{a:1,b:1,box:0,wiresA:0,j5:0,up:1,clock:1},
   html:`<p>Без этого шага каждый ADS1299 работает от своего генератора, и сдвиг между половинами шапки до одного отсчёта (4 мс). Для нейрофидбека и мощности ритмов этого хватает. Общий такт нужен для точной фазы: когерентность, поиск источников.</p>
   <ol><li><b>Вывод 37 у ADS1299</b> на обеих платах: ключ U4 слева сверху, выводы против часовой стрелки, 33–48 на правой стороне снизу вверх. Вывод 37 пятый снизу. Проверьте прозвонкой: соседний 36 звонится на R30, соседний 38 идёт на ESP32, у самого 37 дорожки нет.</li>
   <li>Провод 0,1 мм в лаке, лупа, флюс. Конец залудить, приложить к носику вывода 37 и коснуться паяльником на полсекунды. Так на A и на B. Провод вокруг края платы B, длина до 7 см, закрепить каплей клея.</li>
   <li>Прозвоните: 37 не замкнут на 36 и 38.</li>
   <li><b>На плате B снимите R29.</b> Площадку, которая <b>не</b> звонится на TP4 (DVDD), соедините проводом с TP1 (GND). Теперь B берёт такт от A.</li>
   <li>В <span class="mono">platformio.ini</span> поставьте <span class="mono">-D SYNC_CLOCK=1</span> и перепрошейте обе платы. В мониторе A: <span class="mono">Board B ready</span>.</li></ol>
   <div class="callout"><b>После этого B без A молчит:</b> её ADS1299 не работает без внешнего такта. Чтобы вернуть, поставьте R29 обратно и уберите перемычку на GND.</div>` },
];

function buildBoard(isB){
  const board = new THREE.Group();
  const s = new THREE.Shape(); const r=5, x0=-50, y0=-25, w=100, h=50;
  s.moveTo(x0+r,y0); s.lineTo(x0+w-r,y0); s.quadraticCurveTo(x0+w,y0,x0+w,y0+r); s.lineTo(x0+w,y0+h-r); s.quadraticCurveTo(x0+w,y0+h,x0+w-r,y0+h);
  s.lineTo(x0+r,y0+h); s.quadraticCurveTo(x0,y0+h,x0,y0+h-r); s.lineTo(x0,y0+r); s.quadraticCurveTo(x0,y0,x0+r,y0);
  [[5,5],[95,5],[5,45],[95,45]].forEach(([hx,hy])=>{ const p=new THREE.Path(); p.absarc(hx-50,hy-25,1.6,0,Math.PI*2,true); s.holes.push(p); });
  const g = new THREE.ExtrudeGeometry(s,{depth:1.58,bevelEnabled:false,curveSegments:24}); g.rotateX(-Math.PI/2); g.translate(0,0.01,0);
  const body = new THREE.Mesh(g,[M.mask,M.edge]); body.receiveShadow=true; body.castShadow=true; board.add(body);
  const pg = new THREE.PlaneGeometry(100,50); pg.rotateX(-Math.PI/2);
  const top = new THREE.Mesh(pg,new THREE.MeshStandardMaterial({map:texTop, alphaTest:.5, roughness:.5, metalness:.05})); top.position.y=1.602; top.receiveShadow=true; board.add(top);
  const rig = new THREE.Group(); rig.position.y=1.6; board.add(rig);
  for(const p of P){
    if(p.side!=='top') continue;
    if(isB && (p.ref==='SW1' || /^J3/.test(p.ref))) continue;
    const {g} = BUILD[p.type]();
    const holder = new THREE.Group(); holder.position.copy(L(p.x,p.y)); g.rotation.y=p.rot*Math.PI/180; holder.add(g); rig.add(holder);
  }
  // letter on the silkscreen area near J5
  const lt=textTex([isB?'B':'A'],128,128,{bg:'rgba(0,0,0,0)',fg:'#f2f2ee',font:'700 110px Golos Text, sans-serif'});
  const lp=new THREE.Mesh(new THREE.PlaneGeometry(6,6),new THREE.MeshBasicMaterial({map:lt,transparent:true})); lp.rotation.x=-Math.PI/2; lp.position.set(-21,1.65,19); board.add(lp);
  const el=document.createElement('div'); el.className='lbl '+(isB?'hot':'ok'); el.textContent= isB?'Плата B · К9–К16':'Плата A · К1–К8, Bluetooth';
  const lab=new CSS2DObject(el); lab.position.set(58,4,22); board.add(lab);
  return {board, rig, lab};
}

  const g=new THREE.ExtrudeGeometry(s,{depth:T,bevelEnabled:false,curveSegments:28}); g.translate(0,0,z0-T); wallMesh(g);

function renderPanel(){
  const s=STEPS[cur]; pbody.innerHTML=`<div class="kicker">${s.k}</div><h1>${s.t}</h1>${s.html}<div id="selBox"></div>`; pbody.scrollTop=0;
  const t2=document.getElementById('sock2tab'); if(t2) t2.innerHTML=SOCK2.map((k,i)=>`<tr data-pick="s2:${i}"><td>${sw(k.wire)} ${k.n}</td><td>${k.site}</td><td>отверстие «${k.pad}»</td></tr>`).join('');
  pbody.querySelectorAll('tr[data-pick]').forEach(tr=>tr.addEventListener('click',()=>select(tr.dataset.pick)));
  document.getElementById('badge').textContent=`Шаг ${cur+1} из ${STEPS.length}`;
  document.getElementById('bPrev').disabled = cur===0; document.getElementById('bNext').textContent = cur===STEPS.length-1?'В начало':'Дальше';
  doneBox.checked = getDone().includes(cur);
  renderNav(); renderSel();
}
function select(key){ selected=key; SOCK2.forEach(s=>s.el.classList.remove('hot')); if(key&&key.startsWith('s2:')) SOCK2[+key.slice(3)].el.classList.add('hot'); renderSel(); }
function renderSel(){ const b=document.getElementById('selBox'); if(!b) return; if(!selected){ b.innerHTML=''; return; }
  const k=SOCK2[+selected.slice(3)];
  b.innerHTML=`<div class="sel"><div class="ref">Гнездо ${k.n} · ${k.site}</div><div>${sw(k.wire)} провод → плата B, отверстие «${k.pad}» (${k.j3}, ${k.sig})</div></div>`; }
async function go(i){
  if(i<0||i>=STEPS.length) return; token++; cur=i; selected=null;
  const s=STEPS[i]; applyState(s.state); renderPanel(); moveCam(s.view);
  try{ switch(s.anim){ case 'selftest': await animSelftest(); break; case 'flash': await animFlash(); break; case 'stack': await animStack(); break;
    case 'j5': await animJ5(); break; case 'power': await animPower(); break; case 'sock2': await animSock2(); break;
    case 'check': await animCheck(); break; case 'clock': await animClock(); break; } }catch(e){ console.error(e); }
}
document.getElementById('bNext').onclick=()=>go(cur===STEPS.length-1?0:cur+1);
document.getElementById('bPrev').onclick=()=>go(cur-1);
document.getElementById('bReplay').onclick=()=>go(cur);
document.getElementById('bLid').onclick=e=>{ lid.visible=!lid.visible; e.currentTarget.setAttribute('aria-pressed',lid.visible); };
document.getElementById('bCase').onclick=e=>{ const v=!encl.visible; encl.visible=v; e.currentTarget.setAttribute('aria-pressed',!v); };
document.getElementById('bView').onclick=()=>moveCam('overview');
addEventListener('keydown',e=>{ if(e.target.closest('input')) return; if(e.key==='ArrowRight') go(Math.min(cur+1,STEPS.length-1)); if(e.key==='ArrowLeft') go(cur-1); });

const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(); let downAt=null;
renderer.domElement.addEventListener('pointerdown',e=>{ downAt=[e.clientX,e.clientY]; document.getElementById('hint').hidden=true; });
renderer.domElement.addEventListener('pointerup',e=>{ if(!downAt) return; const moved=Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1]); downAt=null; if(moved>5) return;
  const r=renderer.domElement.getBoundingClientRect(); ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera); const hit=ray.intersectObjects(pickables.filter(o=>{ let v=true; o.traverseAncestors(a=>{ if(!a.visible) v=false; }); return v&&o.visible; }),false)[0];
  if(hit) select(hit.object.userData.pick); });

function resize(){ const w=vp.clientWidth, h=vp.clientHeight; renderer.setSize(w,h,false); renderer.domElement.style.width=w+'px'; renderer.domElement.style.height=h+'px'; labelR.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(vp); resize();
GuideKit.loop(renderer, ()=>{ controls.update(); renderer.render(scene,camera); labelR.render(scene,camera); }, {controls, resize, idleFps:0});

const hashStep = parseInt((location.hash||'').replace(/\D/g,''),10);
go(Number.isFinite(hashStep) && hashStep>=1 && hashStep<=STEPS.length ? hashStep-1 : 0);
window.__s16={go,camera,controls,scene,STEPS};
</script>
</body></html>
