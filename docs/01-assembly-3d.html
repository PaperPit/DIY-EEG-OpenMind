<script type="module">
const {THREE, OrbitControls, CSS2DRenderer, CSS2DObject, RoomEnvironment, mergeGeometries} = window.THREE_KIT;
const {PADS, TEX_BOT, TEX_TOP} = window.EEG_BOARD;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- parts (coordinates in mm from the board's lower-left corner, as in Gerber) ---------- */
const VAL = {}, P = [];
const NOTE = {};
function add(ref, side, x, y, rot, type, step, val, pkg){ P.push({ref, side, x, y, rot, type, step, val, pkg}); }
// step indices are defined in STEPS below
const S_U4=3, S_PWR=4, S_ESD=5, S_RIN=6, S_R=7, S_C=8, S_BIG=9, S_BOT=12, S_THT=13;
add('U4','top',39.5,25.0,0,'tqfp',S_U4,'ADS1299IPAG','TQFP-64, шаг 0,5');
add('U1','top',68.25,38.75,0,'wson',S_PWR,'LM27762DSSR','WSON-12');
add('U2','top',83.8,29.05,0,'sot23',S_PWR,'TLV75733PDBVR, 3,3 В 1 А','SOT-23-5');
add('U3','top',84.0,38.35,0,'sot23',S_PWR,'TPS7A2033PDBVR, 3,3 В малошумящий','SOT-23-5');
[43.75,35.0,25.0,15.0,6.25].forEach((y,i)=>add('D'+(i+1),'top',18.25,y,0,'sc70',S_ESD,'TPD4E1B06DCKR','SC-70-6'));
add('D7','top',89.25,19.5,0,'sod523',S_ESD,'ESD5Z5.0T1G, TVS 5 В','SOD-523');
for(let i=0;i<18;i++) add('R'+(10+i),'top',22.83,46.25-2.5*i,0,'r0603',S_RIN,'2,2 кОм 0,1 %','0603');
add('R1','top',69.25,32.95,0,'r0603',S_R,'130 кОм','0603');
add('R2','top',69.05,35.15,0,'r0603',S_R,'120 кОм 0,1 %','0603');
add('R3','top',66.05,45.35,0,'r0603',S_R,'105 кОм 0,1 %','0603');
add('R4','top',66.07,43.25,0,'r0603',S_R,'100 кОм 0,1 %','0603');
add('R5','top',88.75,12.25,0,'r0603',S_R,'5,1 кОм','0603');
add('R6','top',88.75,15.5,0,'r0603',S_R,'5,1 кОм','0603');
add('R7','top',84.85,6.75,0,'r0603',S_R,'10 кОм','0603');
add('R8','top',54.25,15.25,0,'r0603',S_R,'10 кОм','0603');
add('R9','top',33.25,35.0,0,'r0603',S_R,'1 МОм','0603');
add('R28','top',53.75,28.25,90,'r0603',S_R,'10 кОм','0603');
add('R29','top',45.25,35.75,90,'r0603',S_R,'10 кОм','0603');
add('R30','top',48.75,24.75,90,'r0603',S_R,'10 кОм','0603');
add('R31','top',50.0,21.75,90,'r0603',S_R,'10 кОм','0603');
const C = (ref,x,y,rot,pkg,val)=>add(ref,'top',x,y,rot,'c'+pkg,S_C,val,pkg);
C('C1',64.45,39.15,90,'0603','0,47 мкФ X7R');
C('C2',72.25,38.75,90,'0805','4,7 мкФ X7R'); C('C3',75.25,40.65,90,'0805','4,7 мкФ X7R');
C('C4',65.25,35.45,90,'0805','2,2 мкФ X7R'); C('C5',70.18,43.25,0,'0805','2,2 мкФ X7R');
C('C6',87.75,29.05,90,'0805','10 мкФ X5R'); C('C7',80.5,29.0,90,'0805','10 мкФ X5R');
C('C9',80.7,38.35,90,'0805','10 мкФ X5R'); C('C10',87.95,38.05,90,'0603','1 мкФ X7R');
C('C11',84.75,4.75,0,'0603','1 мкФ X7R'); C('C12',81.75,2.25,90,'0805','10 мкФ X5R');
C('C13',79.5,2.0,90,'0603','100 нФ X7R'); C('C14',33.0,36.75,0,'0603','1,5 нФ C0G');
C('C32',39.5,15.5,0,'0603','100 нФ X7R'); C('C33',39.5,13.75,0,'0805','10 мкФ X5R');
C('C34',44.75,13.6,90,'1206','100 мкФ X5R'); C('C35',47.25,14.75,90,'0603','1 мкФ X7R');
C('C36',38.5,35.75,90,'0603','1 мкФ X7R'); C('C37',40.25,35.5,90,'0603','100 нФ X7R');
C('C38',42.25,14.75,90,'0603','1 мкФ X7R'); C('C39',42.5,35.25,0,'0603','1 мкФ X7R');
C('C40',33.75,15.5,0,'0603','1 мкФ X7R'); C('C41',33.75,17.25,0,'0603','100 нФ X7R');
C('C42',36.5,15.5,0,'0603','100 нФ X7R'); C('C43',36.5,13.75,0,'0603','1 мкФ X7R');
C('C44',36.0,36.75,0,'0603','1 мкФ X7R'); C('C45',36.0,35.0,0,'0603','100 нФ X7R');
C('C46',49.25,31.0,90,'0603','1 мкФ X7R'); C('C47',47.5,30.75,90,'0603','100 нФ X7R');
C('C48',89.32,22.0,0,'0805','4,7 мкФ X7R');
add('U5','top',68.0,6.75,0,'esp32',S_BIG,'ESP32-S3-WROOM-1-N16R8','модуль 18 × 25,5 мм');
add('J2','top',96.63,13.43,0,'usbc',S_BIG,'HRO TYPE-C-31-M-12','USB-C 16P, лапки в пазы');
add('SW3','top',54.5,10.75,0,'tact',S_BIG,'Кнопка BOOT (GPIO0)','SMD 3 × 4 × 2,5');
add('SW2','top',81.5,10.75,0,'tact',S_BIG,'Кнопка RESET (EN)','SMD 3 × 4 × 2,5');
// bottom side
const CB=[['C16',43.75],['C17',41.25],['C18',38.75],['C19',36.25],['C20',33.75],['C21',31.25],['C22',28.75],['C23',26.25],['C24',23.75],['C25',21.25],['C26',18.75],['C27',16.25],['C28',13.75],['C29',11.25],['C30',9.5],['C15',7.75],['C31',3.75]];
CB.forEach(([r,y])=>add(r,'bot',22.75,y,0,'c0g0603',S_BOT,'1 нФ C0G (NP0)','0603'));
[['R32',22.25],['R33',24.25],['R34',26.25],['R35',28.25]].forEach(([r,y])=>add(r,'bot',41.25,y,0,'r0603',S_BOT,'10 кОм','0603'));
add('C49','bot',90.0,38.25,90,'c0805',S_BOT,'4,7 мкФ X7R','0805');
add('D6','bot',87.25,38.4,90,'sod323',S_BOT,'SD05T1G, TVS 5 В','SOD-323');
// through-hole
const J3N=['BIAS / GND','8+ / 8−','7+ / 7−','6+ / 6−','5+ / 5−','4+ / 4−','3+ / 3−','2+ / 2−','1+ / 1−','REF / SRB2'];
'ABCDEFGHIJ'.split('').forEach((L,i)=>add('J3'+L,'top',12.27,43-4*i,0,'hdr2',S_THT,'Штырьки 2 × 1, шаг 2,54 ('+J3N[i]+')','PLS-2'));
add('JP1','top',34.27,46.25,0,'hdr2',S_THT,'Штырьки 2 × 1 (BOUT–BIN)','PLS-2');
add('J5','top',51.46,3.75,0,'hdr3',S_THT,'Штырьки 3 × 1 (GND–RX–TX)','PLS-3');
add('J1','top',95.7,38.25,0,'jst',S_THT,'JST PH 2 пина, угловой','S2B-PH-K-S');
add('SW1','top',95.25,26.7,0,'ss12',S_THT,'SS12D10, прямой','THT, шаг 4,7');
P.forEach(p=>VAL[p.ref]=p);

const THT_HOLES = PADS.holes.filter(h=>h[2]>=0.7 && h[2]<3);   // header / JST / switch holes (TP1 included)
const USB_SLOTS = [[93.0,9.11],[97.0,9.11],[97.0,17.75],[93.0,17.75]];
const TP = [ {n:'TP1',x:54.0,y:46.0,lab:'GND'}, {n:'TP3',x:54.0,y:42.5,lab:'AVSS'}, {n:'TP2',x:54.0,y:39.5,lab:'AVDD'},

 { k:'Оплавление', t:'Нагревательный столик', cam:{x:50,y:22,d:200,h:0.6}, anim:'reflow',
   html:`<ol><li>Поставьте плату на холодный или тёплый (до 100 °C) столик, не наклоняя её. Деталь, сдвинутая сейчас, останется кривой.</li>

 { k:'Нижняя сторона', t:'23 детали снизу', cam:{x:50,y:25,d:160}, anim:'bottom', flipped:true, table:true,

   html:`<ol><li>Штырьки <span class="mono">J3A–J3J</span>, <span class="mono">JP1</span>, <span class="mono">J5</span>: вставьте сверху, переверните плату на подкладку и пропаяйте сначала один вывод. Выровняйте перпендикулярно, затем остальные.</li>

   html:`<p>Для ЭЭГ это не косметика. Остатки флюса между входными дорожками дают утечку и шум, а сопротивление электродов здесь измеряется в килоомах, сигнал в микровольтах.</p>

function partRows(list){ return `<div class="tablewrap"><table class="ptab"><thead><tr><th>Поз.</th><th>Номинал</th><th>Корпус</th></tr></thead><tbody>${

function compact(refs){ const pre=r=>r.replace(/\d+$/,''), num=r=>+(r.match(/\d+$/)||[0])[0];
  const by={}, out=[]; refs.forEach(r=>{ if(!/\d$/.test(r)){ out.push(r); return; } (by[pre(r)]=by[pre(r)]||[]).push(num(r)); });
  for(const [k,ns] of Object.entries(by)){ ns.sort((a,b)=>a-b); let s=ns[0], prev=ns[0];
    const push=(a,b)=>out.push(a===b?k+a: b===a+1? k+a+', '+k+b : k+a+'–'+k+b);
    for(let i=1;i<=ns.length;i++){ if(ns[i]===prev+1){prev=ns[i];continue;} push(s,prev); s=prev=ns[i]; } }
  return out.join(', '); }

const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(); let downAt=null;
renderer.domElement.addEventListener('pointerdown',e=>{ downAt=[e.clientX,e.clientY]; if(!hintSeen){ hintSeen=true; setTimeout(()=>{ document.getElementById('hint').hidden=true; },4000); } });
renderer.domElement.addEventListener('pointerup',e=>{ if(!downAt) return; const moved=Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1]); downAt=null; if(moved>5) return;
  const r=renderer.domElement.getBoundingClientRect(); ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera); const hit=ray.intersectObjects(pickables.filter(o=>{ let v=true; o.traverseAncestors(a=>{ if(!a.visible) v=false; }); return v; }),false)[0];
  if(hit){ select(hit.object.userData.ref); } });

/* render loop */
function resize(){ const w=vp.clientWidth, h=vp.clientHeight; renderer.setSize(w,h,false); renderer.domElement.style.width=w+'px'; renderer.domElement.style.height=h+'px'; labelR.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(vp); resize();
let tt=0;
GuideKit.loop(renderer, t=>{ tt=t; hiMat.opacity = .22 + .2*(0.5+0.5*Math.sin(t/260)); controls.update(); renderer.render(scene,camera); labelR.render(scene,camera); }, {controls, resize, idleFps:()=>P.some(p=>p.hl.visible)?20:0});

const hashStep = parseInt((location.hash||'').replace(/\D/g,''),10);
go(Number.isFinite(hashStep) && hashStep>=1 && hashStep<=STEPS.length ? hashStep-1 : 0);
window.__eeg = {stencil, squeegee, paste, go, P, partByRef, camera, controls, moveCam, setFlip, animFlip};
</script>
